services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/cold_email
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    ports: ["4000:4000"]
  worker:
    build: ./worker
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/cold_email
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  mongo_data:
  redis_data:
